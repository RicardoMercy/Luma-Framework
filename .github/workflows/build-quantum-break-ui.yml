name: Build Quantum Break with UI brightness

# Upload this file to the fork's main branch. This builds the submitted fixes
# plus the UI update without changing the existing pull request's source.
on:
  push:
    branches: [main]
    paths: [.github/workflows/build-quantum-break-ui.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-break-ui-test
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'RicardoMercy/Luma-Framework'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the submitted fixes and pinned dependencies
        uses: actions/checkout@v4
        with:
          ref: 460d9277834465241601b0cfdcce4011dad637e5
          submodules: recursive

      - name: Apply the reviewed HUD and menu brightness update
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $patch = @'
          diff --git a/Shaders/Quantum Break/Includes/GameCBuffers.hlsl b/Shaders/Quantum Break/Includes/GameCBuffers.hlsl
          index 6b4d952..1c1b4ec 100644
          --- a/Shaders/Quantum Break/Includes/GameCBuffers.hlsl	
          +++ b/Shaders/Quantum Break/Includes/GameCBuffers.hlsl	
          @@ -31,6 +31,7 @@ struct LumaGameSettings
              float Flare;
              float GrainType;
              float GrainStrength;
          +   float UIBrightnessNits;
           }; // struct LumaGameSettings
           
           struct LumaGameData
          diff --git a/Shaders/Quantum Break/UI_0xE9BD5102.ps_5_0.hlsl b/Shaders/Quantum Break/UI_0xE9BD5102.ps_5_0.hlsl
          new file mode 100644
          index 0000000..3cc600f
          --- /dev/null
          +++ b/Shaders/Quantum Break/UI_0xE9BD5102.ps_5_0.hlsl	
          @@ -0,0 +1,51 @@
          +#include "./Includes/GameCBuffers.hlsl"
          +#include "../Includes/Common.hlsl"
          +
          +// Embedded ShapeEngine HUD/menu shader; retain the game's texture, vertex
          +// color, color transform, additive color, and alpha before applying brightness.
          +cbuffer embedded_shapeengine : register(b0)
          +{
          +   float4x4 g_mShapeEngineColorTransform : packoffset(c0);
          +   float4 g_vShapeEngineColorAdd : packoffset(c4);
          +}
          +
          +SamplerState g_sTexture_s : register(s0);
          +Texture2D<float4> g_sTexture : register(t0);
          +
          +void main(float3 v0 : TEXCOORD0, float4 v1 : COLOR0, out float4 o0 : SV_Target0)
          +{
          +   float4 color = v1 * g_sTexture.Sample(g_sTexture_s, v0.xy);
          +   float4 transformed = g_mShapeEngineColorTransform._m01_m11_m21_m31 * color.yyyy;
          +   transformed = g_mShapeEngineColorTransform._m00_m10_m20_m30 * color.xxxx + transformed;
          +   transformed = g_mShapeEngineColorTransform._m02_m12_m22_m32 * color.zzzz + transformed;
          +   transformed = g_mShapeEngineColorTransform._m03_m13_m23_m33 * color.wwww + transformed;
          +   o0 = g_vShapeEngineColorAdd + transformed;
          +
          +   // White UI texels must reach the chosen nits after Core's display conversion.
          +   // Keep native gamma-space blending and alpha, and leave the scene untouched.
          +   // The advanced luminance/chrominance gamma modes share gamma 2.2 on neutral white.
          +   if (LumaSettings.DisplayMode == 1 && LumaSettings.GameSettings.UIBrightnessNits != GamePaperWhiteNits)
          +   {
          +      float relative_white = max(LumaSettings.GameSettings.UIBrightnessNits, 1.f) / max(GamePaperWhiteNits, 1.f);
          +#if GAMMA_CORRECTION_RANGE_TYPE == 1
          +      // Core uses the vanilla transfer function for HDR excursions above 1.
          +      if (relative_white > 1.f)
          +      {
          +#if VANILLA_ENCODING_TYPE == 0
          +         relative_white = linear_to_sRGB_gamma1(relative_white);
          +#else
          +         relative_white = linear_to_gamma1(relative_white);
          +#endif
          +      }
          +      else
          +#endif
          +      {
          +#if GAMMA_CORRECTION_TYPE == 0
          +         relative_white = linear_to_sRGB_gamma1(relative_white);
          +#else
          +         relative_white = linear_to_gamma1(relative_white);
          +#endif
          +      }
          +      o0.rgb *= relative_white;
          +   }
          +}
          diff --git a/Source/Games/Quantum Break/Fixes/README.md b/Source/Games/Quantum Break/Fixes/README.md
          index 8a020df..d30383a 100644
          --- a/Source/Games/Quantum Break/Fixes/README.md	
          +++ b/Source/Games/Quantum Break/Fixes/README.md	
          @@ -1,6 +1,6 @@
           # Quantum Break native fixes
           
          -Adds the existing Mouse Fix features to the Quantum Break Luma add-on. There is no second add-on registration, second overlay, or private MinHook build. Existing Luma shaders, HDR conversion, grading, SR inputs/backends, jitter generation, and ultrawide patches are unchanged.
          +Adds the existing Mouse Fix features to the Quantum Break Luma add-on. There is no second add-on registration, second overlay, or private MinHook build. Existing Luma HDR conversion, grading, SR inputs/backends, jitter generation, and ultrawide patches are unchanged. An additional ShapeEngine UI shader provides the HUD/menu brightness control without scaling the scene.
           
           ## Controls
           
          @@ -11,9 +11,12 @@ Adds the existing Mouse Fix features to the Quantum Break Luma add-on. There is
           - Disable Depth of Field: native DOF flag, including cutscenes.
           - Unlock Cutscene FPS: rendered cinematics, including camera/spotlight timing and terminal-camera release correction. Encoded videos are unaffected.
           - High Resolution Particles: the engine's existing full-resolution transparent particle path, including compatible airborne blood. This does not supersample or replace textures.
          +- UI Brightness: HDR HUD/menu reference white, 80-500 nits, default 203 nits. This is a saved Luma slider with the usual reset button. It scales the native ShapeEngine UI shader's RGB before blending, preserves alpha, and leaves scene grading, scene brightness, and the Luma/ReShade panel unchanged. It is disabled in SDR modes. UI white uses the inverse of Core's neutral-white display transfer, including the HDR-range encoding branch, so its reference white follows the chosen nits independently of scene paper white.
           
           Preferences retain the existing [MouseFix] configuration keys in ReShade's configuration. Missing choices default on; explicit saved choices are preserved. An absent separate flare choice inherits the old combined bloom preference once. No separate INI or log is created.
           
          +UI Brightness is stored with the existing Luma grading settings under the `UI Brightness` key. The native-fix preference keys are unaffected. Both the add-on and the updated Quantum Break shaders must be deployed together because the UI slider extends the shared game settings constant buffer.
          +
           ## Coexistence and lifecycle
           
           Initialization runs only from Luma's asynchronous OnInit path, outside the loader lock, after its existing native SR hook installation. The fixes reuse the project's pinned MinHook sources. They never uninitialize the shared hook library. Luma's existing shaders and native jitter/view capture hooks are not patched by these fixes.
          diff --git a/Source/Games/Quantum Break/main.cpp b/Source/Games/Quantum Break/main.cpp
          index 9d4457d..cb46661 100644
          --- a/Source/Games/Quantum Break/main.cpp	
          +++ b/Source/Games/Quantum Break/main.cpp	
          @@ -101,6 +101,16 @@ namespace
                       .member = &CB::LumaGameSettings::GrainStrength,
                       .max_value = 1.f,
                    },
          +         {
          +            .kind = Kind::Float,
          +            .label = "UI Brightness",
          +            .member = &CB::LumaGameSettings::UIBrightnessNits,
          +            .default_value = 203.f,
          +            .min_value = srgb_white_level,
          +            .max_value = 500.f,
          +            .format = "%.0f nits",
          +            .tooltip = "Reference white brightness of the game's HUD and menus in HDR, in nits. Does not change scene brightness.",
          +         },
                 };
           
                 void Initialize()
          @@ -123,6 +133,8 @@ namespace
           
                 void DrawOne(const Descriptor& setting, reshade::api::effect_runtime* runtime)
                 {
          +         const bool is_ui_brightness = setting.member == &CB::LumaGameSettings::UIBrightnessNits;
          +         if (is_ui_brightness) ImGui::BeginDisabled(cb_luma_global_settings.DisplayMode != DisplayModeType::HDR);
                    float& value = cb_luma_global_settings.GameSettings.*(setting.member);
                    const float default_value = default_luma_global_game_settings.*(setting.member);
                    bool changed = false;
          @@ -148,6 +160,7 @@ namespace
                    }
           
                    DrawResetButton(value, default_value, setting.label, runtime);
          +         if (is_ui_brightness) ImGui::EndDisabled();
                 }
           
                 void DrawAll(reshade::api::effect_runtime* runtime)
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'build\UI.patch'), $patch + "`n", [Text.UTF8Encoding]::new($false))
          git apply --ignore-space-change --whitespace=nowarn build/UI.patch
          if ($LASTEXITCODE -ne 0) { throw 'The UI update did not apply. No package will be produced.' }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build the complete integrated Quantum Break add-on
        run: |
          $ErrorActionPreference = 'Stop'
          $filter = @{
            solution = @{
              path = 'Luma.sln'
              projects = @('Source\Games\Quantum Break\Quantum Break.vcxproj')
            }
          }
          $filter | ConvertTo-Json -Depth 4 | Set-Content Luma.slnf
          msbuild Luma.slnf /m /p:Configuration=Publishing-Release /p:Platform=x64 /p:DefineConstants=REMOTE_BUILD=1 /v:minimal /fl '/flp:logfile=build\QuantumBreak.log;verbosity=normal' /bl:build\QuantumBreak.binlog
          if ($LASTEXITCODE -ne 0) { throw 'The complete Luma build failed. See QuantumBreak.log.' }
          if (-not (Test-Path -LiteralPath 'Binaries\x64-Publishing-Release\Luma-Quantum Break.addon')) { throw 'The add-on was not produced.' }

      - name: Package the full add-on, matching shaders and complete Quantum Break source
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Scripts\package.ps1 -Project 'Quantum Break' -Config 'Publishing-Release' -Platform x64 -AddonPath (Join-Path $PWD 'Binaries\x64-Publishing-Release\Luma-Quantum Break.addon') -OutDir (Join-Path $PWD 'package')
          $packagePath = Join-Path $PWD 'package\Luma-Quantum_Break.zip'
          if (-not (Test-Path -LiteralPath $packagePath)) { throw 'The full mod ZIP was not produced.' }
          $package = [IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            if (-not ($package.Entries | Where-Object FullName -Like '*UI_0xE9BD5102.ps_5_0.hlsl')) { throw 'The matching UI shader is missing.' }
            if (-not ($package.Entries | Where-Object FullName -Like '*GameCBuffers.hlsl')) { throw 'The matching settings layout is missing.' }
          } finally { $package.Dispose() }
          $source = [IO.Compression.ZipFile]::Open((Join-Path $PWD 'package\Luma-QuantumBreak-Integrated-Source.zip'), [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($root in @('Source\Games\Quantum Break', 'Shaders\Quantum Break')) {
              foreach ($file in Get-ChildItem -LiteralPath $root -File -Recurse) {
                $relative = [IO.Path]::GetRelativePath($PWD, $file.FullName).Replace('\', '/')
                [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($source, $file.FullName, $relative, [IO.Compression.CompressionLevel]::Optimal) | Out-Null
              }
            }
          } finally { $source.Dispose() }
          @(
            'Complete integrated Quantum Break Luma test build, Publishing-Release x64.'
            'Includes mouse movement/buttons/wheels, motion blur, independent bloom/flares, DOF, rendered-cutscene FPS/camera fixes, full-resolution particles and UI Brightness in nits.'
            'Base source: RicardoMercy/Luma-Framework commit 460d9277834465241601b0cfdcce4011dad637e5, plus the embedded reviewed UI patch.'
            'UI Brightness: 80-500 nits; default 203; saved alongside existing Luma grading settings.'
            'Install the add-on and its matching Luma shader folder together. Do not mix this settings layout with the previous binary.'
            'Use the existing compatible Luma/ReShade runtime; this package does not replace dxgi.dll.'
            'Remove the standalone MouseFix.addon64 when using the integrated Luma add-on.'
            'The source ZIP overlays the Quantum Break game project and shaders into a complete Luma checkout.'
            'In-game HUD/menu coverage still needs testing. This is not an upstream release.'
          ) | Set-Content package\READ-ME.txt
          Get-FileHash -LiteralPath $packagePath -Algorithm SHA256 | Format-List | Out-File package\SHA256.txt

      - name: Upload the complete mod and source
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Break-Luma-with-UI-Brightness
          path: package/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Break-UI-build-logs
          path: build/*
          if-no-files-found: ignore
          retention-days: 7
